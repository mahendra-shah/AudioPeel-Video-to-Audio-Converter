name: mp3_extract
description: "Video to MP3 converter with blazing-fast offline extraction."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Media Processing
  ffmpeg_kit_flutter_new: ^4.1.0

  # Permissions
  permission_handler: ^11.3.1

  # File Operations
  path_provider: ^2.1.4
  file_picker: ^8.0.5
  share_plus: ^12.0.1

  # Database
  sqflite: ^2.3.3+1

  # Ads & Monetization
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

  # UI Utilities
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  google_fonts: ^8.0.1

  # Utilities
  intl: ^0.19.0
  path: ^1.9.0
  shared_preferences: ^2.3.2
  video_thumbnail: ^0.5.6
  open_filex: ^4.5.0
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - android_icon/ic_launcher-web.png
