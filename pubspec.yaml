name: audiopeel
description: "Video to MP3 converter with blazing-fast offline extraction."
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Media Processing
  ffmpeg_kit_flutter_new: ^4.1.0

  # Playback & Preview
  just_audio: ^0.9.46
  video_player: ^2.9.2

  # Permissions
  permission_handler: ^11.3.1

  # File Operations
  path_provider: ^2.1.4
  share_plus: ^12.0.1

  # Database
  sqflite: ^2.3.3+1

  # Ads & Monetization
  google_mobile_ads: ^5.1.0

  # Motion
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Utilities
  intl: ^0.19.0
  path: ^1.9.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  flutter_local_notifications: ^17.2.3
  in_app_review: ^2.0.9
  package_info_plus: ^8.0.0
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  mocktail: ^1.0.4
  fake_async: ^1.3.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/icon/audiopeel-nobg.png

  fonts:
    - family: Jakarta
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-500.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-700.ttf
          weight: 700
